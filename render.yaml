services:
  - type: web
    name: spheronix-training
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: spheronix
      - key: NOTIFICATION_EMAIL
        value: spheronixtechnology@gmail.com
      - key: SMTP_USER
        value: spheronixtechnology@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
